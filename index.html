<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFPM Live Demo</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
  <div class="logo-container">
    <div class="camera-container">
      <video id="video" class="camera-feed" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      
      <svg viewBox="0 0 200 200" class="face-mesh">
        <defs>
          <linearGradient id="grid-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.8"/>
            <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:0.4"/>
          </linearGradient>
        </defs>
        
        <g class="grid-lines"></g>
        <g class="landmarks"></g>
        <rect class="projection-overlay" x="0" y="0" width="200" height="200"/>
      </svg>
    </div>
    
    <div class="text">
      <h1>DFPM</h1>
      <p>Dynamic Facial Projection Mapping</p>
    </div>
  </div>

  <script src="script.js"></script>
